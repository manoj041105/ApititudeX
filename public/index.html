<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AptitudeX — Aptitude & Reasoning Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#0a0a0a;--card:#141414;--ink:#f2f2f2;--mut:#a3a3a3;--line:#2c2c2c;--ac:#e5192b;--ac2:#2a0f12;--acT:#ff6671;--ok:#3ccf91;--bad:#ff8087;--warn:#f0b43a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fff;--card:#f6f6f6;--ink:#0a0a0a;--mut:#555;--line:#dcdcdc;--ac:#c8102e;--ac2:#fde8ea;--acT:#c8102e;--ok:#0f7a50;--bad:#c8102e;--warn:#9a6700}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--card:#f6f6f6;--ink:#0a0a0a;--mut:#555;--line:#dcdcdc;--ac:#c8102e;--ac2:#fde8ea;--acT:#c8102e;--ok:#0f7a50;--bad:#c8102e;--warn:#9a6700}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'DM Sans',system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:1080px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-weight:700;font-size:18px;white-space:nowrap}.logo b{color:var(--acT)}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button{border:0;background:none;color:var(--mut)}nav button.on{background:var(--ac2);color:var(--acT);font-weight:700}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1080px;margin:auto;padding:20px 16px 60px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:22px 0 10px}.mut{color:var(--mut)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.big{font-size:26px;font-weight:700;line-height:1.1}
.hero{background:var(--ac);color:#fff;border-radius:12px;padding:18px}.hero h1{font-size:28px}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}.row span:first-child{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis}
.trk{flex:1;height:10px;background:var(--ac2);border-radius:6px;overflow:hidden}.trk i{display:block;height:100%;background:var(--ac)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--ac2);color:var(--acT);margin:2px}
.bd{font-size:12px;white-space:nowrap}.d1{color:var(--ok)}.d2{color:var(--warn)}.d3{color:var(--bad)}
select,input,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:90px}label{display:block;font-weight:500;margin:10px 0 4px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--ac);background:var(--ac2)}.opt.ok{border-color:var(--ok);background:var(--card)}.opt.no{border-color:var(--bad)}
.timer{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.pal button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.pal .a{background:var(--ac);color:#fff}.pal .c{border:2px solid var(--ink)}
.sol{background:var(--ac2);border-radius:8px;padding:10px;margin-top:8px;font-size:14px}
.note{border-left:3px solid var(--warn);padding:8px 12px;background:var(--card);border-radius:6px;font-size:13px;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid var(--line)}
.sc{overflow-x:auto}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}main{position:relative;z-index:1}
.hero{background:linear-gradient(120deg,var(--ac),#7a0f1a,var(--ac));background-size:200% 100%;animation:shine 8s linear infinite;box-shadow:0 0 28px rgba(229,25,43,.35)}
@keyframes shine{to{background-position:200% 0}}
.opt{transition:transform .15s,box-shadow .2s}.opt:not(:disabled):hover{transform:translateX(4px);border-color:var(--ac)}
.opt.ok{box-shadow:0 0 16px var(--ok)}.opt.no{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mana{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--acT)}.mana .trk{width:56px;height:8px;flex:none}
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 42%,#33060d,#000 68%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;transition:opacity 1s}
#intro.go{opacity:0}#intro.go .portal{transform:scale(16)}#intro.go .itx{opacity:0}
.portal{width:min(58vw,280px);aspect-ratio:1;border-radius:50%;position:relative;transition:transform 1.1s cubic-bezier(.6,0,.9,.4);box-shadow:0 0 80px 20px rgba(229,25,43,.5),inset 0 0 60px #000}
.portal:before,.portal:after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#e5192b,#ffb703,#000,#e5192b,#ff6671,#000,#e5192b);animation:spin 5s linear infinite;-webkit-mask:radial-gradient(circle,transparent 36%,#000 40%,#000 70%,transparent 74%);mask:radial-gradient(circle,transparent 36%,#000 40%,#000 70%,transparent 74%)}
.portal:after{inset:14%;animation-duration:3s;animation-direction:reverse;filter:blur(1px)}
@keyframes spin{to{transform:rotate(360deg)}}
.itx{transition:opacity .5s;margin-top:26px}.itx h1{font-size:34px;letter-spacing:1px}.itx .btn{margin:6px;font-size:16px}
.crt{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);z-index:40;text-align:center;cursor:pointer;max-width:min(92vw,340px);animation:fly .8s cubic-bezier(.2,1.4,.4,1) both;--g:#ffb703}
.crt.bad{--g:#8b5cf6}.crt .em{font-size:88px;line-height:1;display:inline-block;filter:drop-shadow(0 0 20px var(--g));animation:bob 1.6s ease-in-out infinite}
.crt.bad .em{animation:bob 2.6s ease-in-out infinite,flick 1.3s steps(2) infinite}.crt.hop .em{animation:flip .7s}
.crt .bub{background:var(--card);color:var(--ink);border:2px solid var(--g);border-radius:14px;padding:8px 12px;margin-bottom:6px;box-shadow:0 0 18px var(--g);font-size:14px}
.crt.out{animation:poof .45s forwards}
@keyframes fly{from{opacity:0;transform:translate(-50%,160px) scale(.2) rotate(-25deg)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes bob{50%{transform:translateY(-12px)}}@keyframes flick{50%{opacity:.7}}@keyframes flip{to{transform:rotate(360deg) scale(1.3)}}
@keyframes poof{to{opacity:0;transform:translate(-50%,-40px) scale(.1) rotate(200deg)}}
.zoo{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.pet{width:92px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px}.pet span{font-size:34px;display:block}.pet small{font-size:11px;color:var(--mut)}.pet.lock span{filter:grayscale(1) brightness(.4)}
.status-pill{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold;margin-left:6px;background:var(--ac2);color:var(--acT)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body>
<canvas id="fx" aria-hidden="true"></canvas>
<header><div class="bar"><div class="logo">Aptitude<b>X</b> <span class="status-pill" id="backend-status">API Connected</span></div><nav id="nav"></nav><div id="mana" class="mana" title="Mana and level"></div><button class="btn" id="th" aria-label="Toggle theme">◐</button></div></header>
<main id="app"></main>
<div id="intro" role="dialog" aria-label="Enter the realm"><div class="portal"></div><div class="itx"><h1>AptitudeX</h1><p>Practice smarter. Prepare better. Crack your placement exams.</p><button class="btn p" id="enter">Enter the Realm ✨</button><button class="btn" id="skip">Skip</button></div></div>
<script type="application/json" id="qdata">[{"id":1,"category":"Quantitative Aptitude","topic":"Percentages","subtopic":"Percentages","difficulty":"Easy","question":"What is 10% of 200?","options":["20","30","10","40"],"answer":"20","explanation":"10% of 200 = 200 × 10/100 = 20.","company":"General","exam":"Placement Aptitude","year":2026,"question_type":"MCQ","time_limit":60,"marks":1,"negative_marks":0,"tags":["percentages","easy"]},{"id":2,"category":"Quantitative Aptitude","topic":"Percentages","subtopic":"Percentages","difficulty":"Easy","question":"What is 10% of 400?","options":["40","50","30","60"],"answer":"40","explanation":"10% of 400 = 400 × 10/100 = 40.","company":"General","exam":"Placement Aptitude","year":2026,"question_type":"MCQ","time_limit":60,"marks":1,"negative_marks":0,"tags":["percentages","easy"]}]</script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const LS={g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const norm=s=>String(s).toLowerCase().replace(/&/g,'and').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- REST API Client ---------- */
const API = {
  token: localStorage.getItem('ax_token') || '',
  async call(endpoint, method = 'GET', body = null) {
    const headers = { 'Content-Type': 'application/json' };
    if (this.token) headers['Authorization'] = `Bearer ${this.token}`;
    const opts = { method, headers };
    if (body) opts.body = JSON.stringify(body);
    try {
      const res = await fetch('/api' + endpoint, opts);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Server returned status ${res.status}`);
      }
      return await res.json();
    } catch (e) {
      console.warn('API Client Fallback:', endpoint, e.message);
      return null;
    }
  }
};

let RAW = JSON.parse($('#qdata').textContent);

/* ---------- Data layer: Express API + local fallback ---------- */
const DB={
 ext:()=>LS.g('ax_q',{add:[],del:[],cats:{}}),
 all(){const x=this.ext(),m=new Map();RAW.forEach(q=>m.set(q.id,q));x.add.forEach(q=>m.set(q.id,q));x.del.forEach(i=>m.delete(i));return[...m.values()]},
 async init(){
   const res = await API.call('/questions?limit=2000');
   if (res && res.questions && res.questions.length > 0) {
     RAW = res.questions;
     const statusEl = $('#backend-status');
     if (statusEl) statusEl.textContent = 'REST Backend Connected';
   }
 },
 save(q){const x=this.ext();x.add=x.add.filter(a=>a.id!==q.id);x.add.push(q);x.del=x.del.filter(i=>i!==q.id);LS.s('ax_q',x);API.call('/questions', 'POST', q)},
 del(id){const x=this.ext();x.add=x.add.filter(a=>a.id!==id);x.del.push(id);LS.s('ax_q',x);API.call(`/questions/${id}`, 'DELETE')},
 nextId(){return Math.max(0,...this.all().map(q=>+q.id||0))+1},
 clean(o){const q={id:o.id,category:o.category,topic:o.topic,subtopic:o.subtopic||o.topic,difficulty:o.difficulty||'Easy',question:o.question,options:o.options,answer:o.answer,explanation:o.explanation||'',company:o.company||'General',exam:o.exam||'Placement Practice',year:+o.year||new Date().getFullYear(),question_type:o.question_type||'MCQ',time_limit:+o.time_limit||60,marks:+o.marks||1,negative_marks:+o.negative_marks||0,tags:o.tags||[]};
  if(!q.category||!q.topic||!q.question||!Array.isArray(q.options)||q.options.length<2||!q.options.includes(q.answer))return null;return q}
};
const BASE_CAT={'Quantitative Aptitude':['Percentages','Profit & Loss','Average','Ratio & Proportion','Time & Work','Time, Speed & Distance','Simple Interest','Compound Interest','Probability','Permutation & Combination','Number System','HCF & LCM','Algebra','Ages','Mixtures','Data Interpretation'],'Logical Reasoning':['Number Series','Coding-Decoding','Blood Relations','Directions','Syllogisms','Seating Arrangement','Puzzles','Analogy','Classification','Statement & Conclusion','Data Sufficiency','Clocks','Calendars'],'Verbal Ability':['Reading Comprehension','Sentence Correction','Synonyms','Antonyms','Para Jumbles','Fill in the Blanks','Vocabulary','Grammar']};
function catalog(){const c=JSON.parse(JSON.stringify(BASE_CAT));Object.entries(DB.ext().cats).forEach(([k,v])=>c[k]=[...new Set([...(c[k]||[]),...v])]);
 DB.all().forEach(q=>{c[q.category]=c[q.category]||[];if(!c[q.category].some(t=>norm(t)===norm(q.topic)))c[q.category].push(q.topic)});return c}
const COMP=['TCS','Infosys','Wipro','Accenture','Cognizant','Capgemini','Deloitte','IBM','EY','HCL','Tech Mahindra','Amazon','Microsoft','Other MNCs'];

/* ---------- Auth & Progress ---------- */
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let U=LS.g('ax_sess',null);const uid=()=>U?U.email:'guest';
const P=(id)=>LS.g('ax_p_'+(id||uid()),{att:[],bm:[],mocks:[],rep:[]});const savP=p=>LS.s('ax_p_'+uid(),p);
const SC=()=>LS.g('ax_sc',{c:1,w:0,u:0});
const prep=q=>({...q,opts:shuf(q.options)});
function rec(q,ok,sec){const p=P();p.att.push({id:q.id,topic:q.topic,cat:q.category,ok:+ok,sec,day:today()});savP(p);API.call('/user/attempt','POST',{id:q.id,topic:q.topic,cat:q.category,ok:+ok,sec})}

/* ---------- UI Components ---------- */
const Badge=d=>{const n={Easy:1,Medium:2,Hard:3}[d]||1;return `<span class="bd d${n}" title="${esc(d)}">${'●'.repeat(n)}${'○'.repeat(3-n)} ${esc(d)}</span>`};
const Bar=(l,v,s='%',m=100)=>`<div class="row"><span title="${esc(l)}">${esc(l)}</span><div class="trk"><i style="width:${Math.min(100,v/m*100)}%"></i></div><b>${v}${s}</b></div>`;
const DashCard=(v,l)=>`<div class="card"><div class="big">${v}</div><span class="mut">${l}</span></div>`;
const Timer=id=>`<span class="timer" id="${id}">--:--</span>`;
const TopicCard=(t,n,acc,fn)=>`<div class="card"><b>${esc(t)}</b><div class="mut">${n?n+' questions':'Coming soon'}${acc==null?'':' · your accuracy '+acc+'%'}</div><button class="btn p" style="margin-top:8px" ${n?'':'disabled'} onclick="${fn}">Practice</button></div>`;
function QuestionCard(q,i,tot,sel,sub,fn,bm){return `<div class="card"><div class="top"><span class="mut">Question ${i+1} of ${tot} · ${esc(q.topic)}</span>${Badge(q.difficulty)}</div><p><b>${esc(q.question)}</b></p>${q.opts.map((o,k)=>{let c=sel===o?'sel':'';if(sub){c=o===q.answer?'ok':sel===o?'no':''}return `<button class="opt ${c}" ${sub?'disabled':''} onclick="${fn}(${k})">${'ABCDEF'[k]}. ${esc(o)}</button>`}).join('')}${sub?`<div class="sol"><b class="${sel===q.answer?'ok-t':'bad-t'}">${sel===q.answer?'Correct':'Incorrect'}.</b> Answer: ${esc(q.answer)}<br>${esc(q.explanation)}</div>`:''}</div>`}
function ResultCard(r){return `<div class="grid">${DashCard(r.correct+'/'+r.total,'Score ('+r.score+' marks)')}${DashCard(r.acc+'%','Accuracy')}${DashCard(fmt(r.took),'Time taken')}${DashCard(r.att,'Attempted')}${DashCard(r.correct,'Correct')}${DashCard(r.wrong,'Incorrect')}${DashCard(r.un,'Unattempted')}</div>`}

/* ---------- Router ---------- */
let view='Dashboard',tick=null,PR=null,MK=null,RES=null,A={tab:'stats'},F={};
const NAVS=()=>['Dashboard','Topics','Practice Questions','Mock Test','Companies','Leaderboard',...(U&&U.admin?['Admin']:[]),U?'Logout':'Login'];
function go(v){clearInterval(tick);if(v==='Logout'){U=null;API.token='';LS.s('ax_token','');LS.s('ax_sess',null);v='Login'}view=v;PR=v==='Practice'?PR:null;render();scrollTo(0,0)}
function render(){$('#nav').innerHTML=NAVS().map(n=>`<button class="${n===view?'on':''}" onclick="go('${n}')">${n}</button>`).join('');
 const m={Dashboard:dash,Topics:topics,'Practice Questions':browse,'Mock Test':mockSetup,Companies:companies,Leaderboard:board,Admin:admin,Login:()=>auth('login'),Signup:()=>auth('signup'),Forgot:()=>auth('forgot'),Practice:prShow,Mock:mkShow,Result:resView,PEnd:pEnd};(m[view]||dash)()}

/* ---------- Dashboard ---------- */
function dash(){const p=P(),n=p.att.length,ok=p.att.reduce((a,b)=>a+b.ok,0),acc=n?Math.round(100*ok/n):0,by={};
 p.att.forEach(a=>{const b=by[a.topic]=by[a.topic]||{n:0,ok:0};b.n++;b.ok+=a.ok});
 const te=Object.entries(by).map(([k,v])=>[k,Math.round(100*v.ok/v.n),v.n]).sort((a,b)=>b[1]-a[1]);
 const days=new Set([...p.att.map(a=>a.day),...p.mocks.map(m=>m.day)]);let st=0,d=new Date();while(days.has(d.toISOString().slice(0,10))){st++;d.setDate(d.getDate()-1)}
 const avg=p.mocks.length?Math.round(p.mocks.reduce((a,m)=>a+m.acc,0)/p.mocks.length):0;
 const last7=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);const k=x.toISOString().slice(0,10);return[k.slice(5),p.att.filter(a=>a.day===k).length]});
 app.innerHTML=`<div class="hero"><h1>AptitudeX — Aptitude & Reasoning Practice</h1><div>Practice smarter. Prepare better. Crack your placement exams.</div><p style="margin:10px 0 0">${U?'Signed in as '+esc(U.name):'Practising as guest. Progress is saved locally & synced with backend. <a href="#" style="color:#fff" onclick="go(\'Login\');return false">Log in</a> for cloud sync.'}</p></div>
 <h2>Your progress</h2><div class="grid">${DashCard(n,'Attempted')}${DashCard(ok,'Solved')}${DashCard(acc+'%','Accuracy')}${DashCard(st+' 🔥','Day streak')}${DashCard(p.mocks.length,'Mock tests')}${DashCard(avg+'%','Avg mock accuracy')}</div>
 <div class="grid g2"><div><h2>Strongest topics</h2><div class="card">${te.slice(0,4).map(t=>Bar(t[0],t[1])).join('')||'<span class="mut">Practice to see data.</span>'}</div></div><div><h2>Weakest topics</h2><div class="card">${te.slice(-4).reverse().map(t=>Bar(t[0],t[1])).join('')||'<span class="mut">Practice to see data.</span>'}</div></div></div>
 <h2>Questions solved, last 7 days</h2><div class="card">${last7.map(x=>Bar(x[0],x[1],'',Math.max(5,...last7.map(y=>y[1])))).join('')}</div>
 <h2>Recent activity</h2><div class="card">${[...p.mocks.slice(-3).map(m=>`${m.day}: ${esc(m.title)}, ${m.correct}/${m.total} (${m.acc}%)`),...p.att.slice(-4).map(a=>`${a.day}: ${esc(a.topic)}, ${a.ok?'correct':'incorrect'}`)].reverse().join('<br>')||'<span class="mut">No activity yet.</span>'}</div>
 <p><button class="btn p" onclick="go('Topics')">Start practising</button> <button class="btn" onclick="go('Mock Test')">Take a mock test</button></p>`}

/* ---------- Topics ---------- */
function topics(){const c=catalog(),all=DB.all(),p=P(),by={};p.att.forEach(a=>{const b=by[norm(a.topic)]=by[norm(a.topic)]||{n:0,ok:0};b.n++;b.ok+=a.ok});
 app.innerHTML='<h1>Topics</h1><p class="mut">Pick a topic to practise one question at a time.</p>'+Object.entries(c).map(([k,ts])=>`<h2>${esc(k)}</h2><div class="grid g2">${ts.map(t=>{const n=all.filter(q=>q.category===k&&norm(q.topic)===norm(t)).length,b=by[norm(t)];return TopicCard(t,n,b?Math.round(100*b.ok/b.n):null,`startTopic(${JSON.stringify(k).replace(/"/g,'&quot;')},${JSON.stringify(t).replace(/"/g,'&quot;')})`)}).join('')}</div>`).join('')}
function startTopic(k,t){startPractice(DB.all().filter(q=>q.category===k&&norm(q.topic)===norm(t)),t)}

/* ---------- Practice mode ---------- */
function startPractice(list,title){if(!list.length)return alert('No questions match.');PR={title,qs:shuf(list).map(prep),i:0,sel:{},sub:{},sp:{},t:Date.now()};view='Practice';render()}
function prShow(){if(!PR)return go('Topics');const q=PR.qs[PR.i],i=PR.i,bm=P().bm.includes(q.id);
 app.innerHTML=`<div class="top"><h1>${esc(PR.title)}</h1><span class="mut">${Object.keys(PR.sub).length} submitted</span></div>${QuestionCard(q,i,PR.qs.length,PR.sel[i],PR.sub[i],'pPick')}
