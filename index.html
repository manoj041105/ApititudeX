<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AptitudeX — Aptitude & Reasoning Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#0a0a0a;--card:#141414;--ink:#f2f2f2;--mut:#a3a3a3;--line:#2c2c2c;--ac:#e5192b;--ac2:#2a0f12;--acT:#ff6671;--ok:#3ccf91;--bad:#ff8087;--warn:#f0b43a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fff;--card:#f6f6f6;--ink:#0a0a0a;--mut:#555;--line:#dcdcdc;--ac:#c8102e;--ac2:#fde8ea;--acT:#c8102e;--ok:#0f7a50;--bad:#c8102e;--warn:#9a6700}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--card:#f6f6f6;--ink:#0a0a0a;--mut:#555;--line:#dcdcdc;--ac:#c8102e;--ac2:#fde8ea;--acT:#c8102e;--ok:#0f7a50;--bad:#c8102e;--warn:#9a6700}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'DM Sans',system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:1080px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-weight:700;font-size:18px;white-space:nowrap}.logo b{color:var(--acT)}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button{border:0;background:none;color:var(--mut)}nav button.on{background:var(--ac2);color:var(--acT);font-weight:700}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1080px;margin:auto;padding:20px 16px 60px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:22px 0 10px}.mut{color:var(--mut)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.big{font-size:26px;font-weight:700;line-height:1.1}
.hero{background:var(--ac);color:#fff;border-radius:12px;padding:18px}.hero h1{font-size:28px}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}.row span:first-child{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis}
.trk{flex:1;height:10px;background:var(--ac2);border-radius:6px;overflow:hidden}.trk i{display:block;height:100%;background:var(--ac)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--ac2);color:var(--acT);margin:2px}
.bd{font-size:12px;white-space:nowrap}.d1{color:var(--ok)}.d2{color:var(--warn)}.d3{color:var(--bad)}
select,input,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:90px}label{display:block;font-weight:500;margin:10px 0 4px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--ac);background:var(--ac2)}.opt.ok{border-color:var(--ok);background:var(--card)}.opt.no{border-color:var(--bad)}
.timer{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.pal button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.pal .a{background:var(--ac);color:#fff}.pal .c{border:2px solid var(--ink)}
.sol{background:var(--ac2);border-radius:8px;padding:10px;margin-top:8px;font-size:14px}
.note{border-left:3px solid var(--warn);padding:8px 12px;background:var(--card);border-radius:6px;font-size:13px;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid var(--line)}
.sc{overflow-x:auto}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}main{position:relative;z-index:1}
.hero{background:linear-gradient(120deg,var(--ac),#7a0f1a,var(--ac));background-size:200% 100%;animation:shine 8s linear infinite;box-shadow:0 0 28px rgba(229,25,43,.35)}
@keyframes shine{to{background-position:200% 0}}
.opt{transition:transform .15s,box-shadow .2s}.opt:not(:disabled):hover{transform:translateX(4px);border-color:var(--ac)}
.opt.ok{box-shadow:0 0 16px var(--ok)}.opt.no{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mana{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--acT)}.mana .trk{width:56px;height:8px;flex:none}
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 42%,#33060d,#000 68%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;transition:opacity 1s}
#intro.go{opacity:0}#intro.go .portal{transform:scale(16)}#intro.go .itx{opacity:0}
.portal{width:min(58vw,280px);aspect-ratio:1;border-radius:50%;position:relative;transition:transform 1.1s cubic-bezier(.6,0,.9,.4);box-shadow:0 0 80px 20px rgba(229,25,43,.5),inset 0 0 60px #000}
.portal:before,.portal:after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#e5192b,#ffb703,#000,#e5192b,#ff6671,#000,#e5192b);animation:spin 5s linear infinite;-webkit-mask:radial-gradient(circle,transparent 36%,#000 40%,#000 70%,transparent 74%);mask:radial-gradient(circle,transparent 36%,#000 40%,#000 70%,transparent 74%)}
.portal:after{inset:14%;animation-duration:3s;animation-direction:reverse;filter:blur(1px)}
@keyframes spin{to{transform:rotate(360deg)}}
.itx{transition:opacity .5s;margin-top:26px}.itx h1{font-size:34px;letter-spacing:1px}.itx .btn{margin:6px;font-size:16px}
.crt{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);z-index:40;text-align:center;cursor:pointer;max-width:min(92vw,340px);animation:fly .8s cubic-bezier(.2,1.4,.4,1) both;--g:#ffb703}
.crt.bad{--g:#8b5cf6}.crt .em{font-size:88px;line-height:1;display:inline-block;filter:drop-shadow(0 0 20px var(--g));animation:bob 1.6s ease-in-out infinite}
.crt.bad .em{animation:bob 2.6s ease-in-out infinite,flick 1.3s steps(2) infinite}.crt.hop .em{animation:flip .7s}
.crt .bub{background:var(--card);color:var(--ink);border:2px solid var(--g);border-radius:14px;padding:8px 12px;margin-bottom:6px;box-shadow:0 0 18px var(--g);font-size:14px}
.crt.out{animation:poof .45s forwards}
@keyframes fly{from{opacity:0;transform:translate(-50%,160px) scale(.2) rotate(-25deg)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes bob{50%{transform:translateY(-12px)}}@keyframes flick{50%{opacity:.7}}@keyframes flip{to{transform:rotate(360deg) scale(1.3)}}
@keyframes poof{to{opacity:0;transform:translate(-50%,-40px) scale(.1) rotate(200deg)}}
.zoo{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.pet{width:92px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px}.pet span{font-size:34px;display:block}.pet small{font-size:11px;color:var(--mut)}.pet.lock span{filter:grayscale(1) brightness(.4)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body>

<script>
const $=s=>document.querySelector(s),app=$('#app');
const LS={g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

const RAW=JSON.parse($('#qdata').textContent);
/* ---------- Data layer: base JSON + local overrides ---------- */
const DB={ext:()=>LS.g('ax_q',{add:[],del:[],cats:{}}),
 all(){const x=this.ext(),m=new Map();RAW.forEach(q=>m.set(q.id,q));x.add.forEach(q=>m.set(q.id,q));x.del.forEach(i=>m.delete(i));return[...m.values()]},
 save(q){const x=this.ext();x.add=x.add.filter(a=>a.id!==q.id);x.add.push(q);x.del=x.del.filter(i=>i!==q.id);LS.s('ax_q',x)},
 del(id){const x=this.ext();x.add=x.add.filter(a=>a.id!==id);x.del.push(id);LS.s('ax_q',x)},

const DashCard=(v,l)=>`<div class="card"><div class="big">${v}</div><span class="mut">${l}</span></div>`;
const Timer=id=>`<span class="timer" id="${id}">--:--</span>`;
const TopicCard=(t,n,acc,fn)=>`<div class="card"><b>${esc(t)}</b><div class="mut">${n?n+' questions':'Coming soon'}${acc==null?'':' · your accuracy '+acc+'%'}</div><button class="btn p" style="margin-top:8px" ${n?'':'disabled'} onclick="${fn}">Practice</button></div>`;
function QuestionCard(q,i,tot,sel,sub,fn,bm){return `<div class="card"><div class="top"><span class="mut">Question ${i+1} of ${tot} · ${esc(q.topic)}</span>${Badge(q.difficulty)}</div><p><b>${esc(q.question)}</b></p>${q.opts.map((o,k)=>{let c=sel===o?'sel':'';if(sub){c=o===q.answer?'ok':sel===o?'no':''}return `<button class="opt ${c}" ${sub?'disabled':''} onclick="${fn}(${k})">${'ABCDEF'[k]}. ${esc(o)}</button>`}).join('')}${sub?`<div class="sol"><b class="${sel===q.answer?'ok-t':'bad-t'}">${sel===q.answer?'Correct':'Incorrect'}.</b> Answer: ${esc(q.answer)}<br>${esc(q.explanation)}</div>`:''}</div>`}
function ResultCard(r){return `<div class="grid">${DashCard(r.correct+'/'+r.total,'Score ('+r.score+' marks)')}${DashCard(r.acc+'%','Accuracy')}${DashCard(fmt(r.took),'Time taken')}${DashCard(r.att,'Attempted')}${DashCard(r.correct,'Correct')}${DashCard(r.wrong,'Incorrect')}${DashCard(r.un,'Unattempted')}</div>`}

/* ---------- Dashboard ---------- */
function dash(){const p=P(),n=p.att.length,ok=p.att.reduce((a,b)=>a+b.ok,0),acc=n?Math.round(100*ok/n):0,by={};
 p.att.forEach(a=>{const b=by[a.topic]=by[a.topic]||{n:0,ok:0};b.n++;b.ok+=a.ok});
 const te=Object.entries(by).map(([k,v])=>[k,Math.round(100*v.ok/v.n),v.n]).sort((a,b)=>b[1]-a[1]);
 const days=new Set([...p.att.map(a=>a.day),...p.mocks.map(m=>m.day)]);let st=0,d=new Date();while(days.has(d.toISOString().slice(0,10))){st++;d.setDate(d.getDate()-1)}
 const avg=p.mocks.length?Math.round(p.mocks.reduce((a,m)=>a+m.acc,0)/p.mocks.length):0;
 const last7=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);const k=x.toISOString().slice(0,10);return[k.slice(5),p.att.filter(a=>a.day===k).length]});
 app.innerHTML=`<div class="hero"><h1>AptitudeX — Aptitude & Reasoning Practice</h1><div>Practice smarter. Prepare better. Crack your placement exams.</div><p style="margin:10px 0 0">${U?'Signed in as '+esc(U.name):'Practising as guest. Progress is saved on this device. <a href="#" style="color:#fff" onclick="go(\'Login\');return false">Log in</a> to keep it under your account.'}</p></div>
 <h2>Your progress</h2><div class="grid">${DashCard(n,'Attempted')}${DashCard(ok,'Solved')}${DashCard(acc+'%','Accuracy')}${DashCard(st+' 🔥','Day streak')}${DashCard(p.mocks.length,'Mock tests')}${DashCard(avg+'%','Avg mock accuracy')}</div>

/* ---------- Topics ---------- */
function topics(){const c=catalog(),all=DB.all(),p=P(),by={};p.att.forEach(a=>{const b=by[norm(a.topic)]=by[norm(a.topic)]||{n:0,ok:0};b.n++;b.ok+=a.ok});

/* ---------- Practice mode ---------- */
function startPractice(list,title){if(!list.length)return alert('No questions match.');PR={title,qs:shuf(list).map(prep),i:0,sel:{},sub:{},sp:{},t:Date.now()};view='Practice';render()}
function prShow(){if(!PR)return go('Topics');const q=PR.qs[PR.i],i=PR.i,bm=P().bm.includes(q.id);
 app.innerHTML=`<div class="top"><h1>${esc(PR.title)}</h1><span class="mut">${Object.keys(PR.sub).length} submitted</span></div>${QuestionCard(q,i,PR.qs.length,PR.sel[i],PR.sub[i],'pPick')}
 <div class="top" style="margin-top:10px"><div><button class="btn" onclick="pGo(-1)" ${i?'':'disabled'}>Previous</button> <button class="btn" onclick="toggleBm(${q.id})">${bm?'★ Bookmarked':'☆ Bookmark'}</button> <button class="btn" onclick="report(${q.id})">Report Question</button></div><div><button class="btn p" onclick="pSubmit()" ${PR.sub[i]?'disabled':''}>Submit</button> <button class="btn" onclick="pGo(1)">${i===PR.qs.length-1?'Finish':'Next'}</button></div></div>`}
function pPick(k){if(PR.sub[PR.i])return;PR.sel[PR.i]=PR.qs[PR.i].opts[k];prShow()}
function pSubmit(){const i=PR.i;if(PR.sel[i]==null)return alert('Select an option first.');if(PR.sub[i])return;PR.sub[i]=1;PR.sp[i]=(PR.sp[i]||0)+Math.round((Date.now()-PR.t)/1000);PR.t=Date.now();rec(PR.qs[i],PR.sel[i]===PR.qs[i].answer,PR.sp[i]);prShow()}
function pGo(d){PR.sp[PR.i]=(PR.sp[PR.i]||0)+(PR.sub[PR.i]?0:Math.round((Date.now()-PR.t)/1000));PR.t=Date.now();const n=PR.i+d;if(n<0)return;if(n>=PR.qs.length){view='PEnd';return render()}PR.i=n;prShow()}
function pEnd(){const ids=Object.keys(PR.sub),ok=ids.filter(i=>PR.sel[i]===PR.qs[i].answer).length,t=ids.reduce((a,i)=>a+(PR.sp[i]||0),0);
 app.innerHTML=`<h1>Practice complete</h1><div class="grid">${DashCard(PR.qs.length,'Questions')}${DashCard(ids.length,'Answered')}${DashCard(ok,'Correct')}${DashCard(ids.length-ok,'Incorrect')}${DashCard(fmt(t),'Time spent')}</div><p><button class="btn p" onclick="go('Topics')">More topics</button> <button class="btn" onclick="go('Dashboard')">Dashboard</button></p>`}
function toggleBm(id){const p=P(),k=p.bm.indexOf(id);k<0?p.bm.push(id):p.bm.splice(k,1);savP(p);view==='Practice'?prShow():browseList()}
function report(id){const r=prompt('What is wrong with this question?');if(!r)return;const p=P();p.rep.push({id,note:r.slice(0,300),day:today()});savP(p);alert('Thanks, the report was saved for the admin.')}

 const sel=(k,l,o)=>`<select onchange="F.${k}=this.value;shown=30;browseList()" aria-label="${l}"><option value="">${l}</option>${o.map(x=>`<option ${F[k]==x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
 app.innerHTML=`<h1>Practice Questions</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="sq" type="search" placeholder="Search questions..." value="${esc(F.s||'')}" oninput="F.s=this.value;shown=30;browseList()" style="flex:1;min-width:200px">${sel('category','Category',u('category'))}${sel('topic','Topic',u('topic'))}${sel('difficulty','Difficulty',u('difficulty'))}${sel('exam','Exam',u('exam'))}${sel('company','Company',u('company'))}${sel('year','Year',u('year'))}${sel('question_type','Type',u('question_type'))}${sel('tag','Tag',tags)}${sel('bm','Saved',['Bookmarked','Attempted wrongly'])}</div><p><button class="btn" onclick="F={};browse()">Clear filters</button> <button class="btn p" onclick="startPractice(filtered(),'Filtered practice')">Practise these</button></p><div id="lst"></div>`;browseList()}
function filtered(){const p=P(),wrong=new Set(p.att.filter(a=>!a.ok).map(a=>a.id)),s=(F.s||'').toLowerCase();return DB.all().filter(q=>(!s||(q.question+' '+q.topic+' '+(q.tags||[]).join(' ')).toLowerCase().includes(s))&&['category','topic','difficulty','exam','company','year','question_type'].every(k=>!F[k]||String(q[k])===F[k])&&(!F.tag||(q.tags||[]).includes(F.tag))&&(F.bm!=='Bookmarked'||p.bm.includes(q.id))&&(F.bm!=='Attempted wrongly'||wrong.has(q.id)))}

/* ---------- Mock tests ---------- */
function mockSetup(co){const c=catalog();const title=typeof co==='string'?co:'';
 app.innerHTML=`<h1>${title?esc(title)+' company-style mock':'Mock test'}</h1>${title?'<div class="note">Company-style Practice: questions are practice questions in a typical recruitment pattern, not actual exam questions.</div>':''}<div class="card" style="margin-top:12px"><label>Number of questions</label><select id="mn">${[10,20,30,50,100].map(n=>`<option>${n}</option>`).join('')}</select><label>Difficulty</label><select id="md"><option>Mixed</option><option>Easy</option><option>Medium</option><option>Hard</option></select><label>Category</label><select id="mc"><option value="">All categories</option>${Object.keys(c).map(k=>`<option>${esc(k)}</option>`).join('')}</select><p class="mut">Time allowed is the sum of each question's time limit. Marking: +${SC().c} correct, −${SC().w} incorrect, ${SC().u} unattempted.</p><button class="btn p" onclick="mockStart('${esc(title)}')">Start mock test</button></div>`}
function mockStart(title,pool,n,tt){const d=$('#md')&&$('#md').value,c=$('#mc')&&$('#mc').value;n=n||+$('#mn').value;pool=pool||DB.all().filter(q=>(!c||q.category===c)&&(!d||d==='Mixed'||q.difficulty===d));
 if(!pool.length)return alert('No questions match these settings yet.');const qs=shuf(pool).slice(0,n).map(prep),secs=qs.reduce((a,q)=>a+(q.time_limit||60),0);
 MK={title:tt||title||'Mock test',qs,ans:{},i:0,t0:Date.now(),end:Date.now()+secs*1000,short:qs.length<n};view='Mock';render()}
function mkShow(){if(!MK)return go('Mock Test');const q=MK.qs[MK.i];
 app.innerHTML=`<div class="top"><h2 style="margin:0">${esc(MK.title)}</h2><span>Time Remaining: ${Timer('tm')}</span></div>${MK.short?`<div class="note">Only ${MK.qs.length} questions matched, so the test is shorter than requested.</div>`:''}<div style="margin-top:10px">${QuestionCard(q,MK.i,MK.qs.length,MK.ans[MK.i],false,'mPick')}</div>
 <div class="top"><div><button class="btn" onclick="mGo(-1)">Previous</button> <button class="btn" onclick="delete MK.ans[MK.i];mkShow()">Clear</button></div><div><button class="btn" onclick="mGo(1)">Next</button> <button class="btn p" onclick="if(confirm('Submit the test?'))mSubmit()">Submit</button></div></div>
 <div class="pal">${MK.qs.map((_,i)=>`<button class="${MK.ans[i]!=null?'a':''} ${i===MK.i?'c':''}" onclick="MK.i=${i};mkShow()">${i+1}</button>`).join('')}</div>`;
 clearInterval(tick);const f=()=>{const l=Math.max(0,Math.round((MK.end-Date.now())/1000)),e=$('#tm');if(e)e.textContent=fmt(l);if(l<=0){clearInterval(tick);mSubmit()}};f();tick=setInterval(f,1000)}
function mPick(k){MK.ans[MK.i]=MK.qs[MK.i].opts[k];mkShow()}
function mGo(d){MK.i=Math.min(MK.qs.length-1,Math.max(0,MK.i+d));mkShow()}
function mSubmit(){clearInterval(tick);if(!MK)return;const sc=SC(),took=Math.min(Math.round((Date.now()-MK.t0)/1000),Math.round((MK.end-MK.t0)/1000)),topics={};let c=0,w=0;
 MK.qs.forEach((q,i)=>{const t=topics[q.topic]=topics[q.topic]||{n:0,ok:0};t.n++;if(MK.ans[i]!=null){if(MK.ans[i]===q.answer){c++;t.ok++}else w++}});
 const tot=MK.qs.length,att=c+w,per=att?Math.round(took/att):0,r={title:MK.title,day:today(),total:tot,att,correct:c,wrong:w,un:tot-att,score:+(c*sc.c-w*sc.w-(tot-att)*sc.u).toFixed(2),acc:att?Math.round(100*c/att):0,took,topics,
  review:MK.qs.map((q,i)=>({q:q.question,topic:q.topic,you:MK.ans[i]==null?null:MK.ans[i],ans:q.answer,ex:q.explanation}))};
 const p=P();MK.qs.forEach((q,i)=>{if(MK.ans[i]!=null)p.att.push({id:q.id,topic:q.topic,cat:q.category,ok:+(MK.ans[i]===q.answer),sec:per,day:today()})});
 p.mocks.push({...r,review:undefined});savP(p);RES=r;MK=null;view='Result';render()}
function resView(){const r=RES;if(!r)return go('Dashboard');const te=Object.entries(r.topics).map(([k,v])=>[k,Math.round(100*v.ok/v.n)]),weak=te.filter(t=>t[1]<60).map(t=>t[0]);
 app.innerHTML=`<h1>Results: ${esc(r.title)}</h1>${ResultCard(r)}<h2>Topic performance</h2><div class="card">${te.map(t=>Bar(t[0],t[1])).join('')}</div>
 <h2>Recommendation</h2><div class="card">${weak.length?`You need more practice in ${esc(weak.join(' and '))}.<br><button class="btn p" style="margin-top:8px" onclick="weakPractice()">Practice Weak Topics</button>`:'Strong performance across all topics. Try a harder or longer mock.'}</div>
 <h2>Review</h2>${r.review.map((x,i)=>`<div class="card" style="margin:8px 0"><b>${i+1}. ${esc(x.q)}</b><div class="${x.you===x.ans?'ok-t':'bad-t'}">Your answer: ${x.you==null?'Not attempted':esc(x.you)}</div><div>Correct answer: ${esc(x.ans)}</div><div class="sol">${esc(x.ex)}</div></div>`).join('')}`}

 const rows=[...[['Aarav S.',92,88,14],['Priya K.',88,85,12],['Rohan M.',81,79,9],['Sneha R.',76,74,7],['Kiran T.',70,68,5]].map(x=>({n:x[0],s:x[1],a:x[2],t:x[3],demo:1})),...(me?[me]:[])].sort((a,b)=>b.s-a.s||b.a-a.a);

function auth(m){const f=(id,l,t='text')=>`<label>${l}</label><input id="${id}" type="${t}" autocomplete="off" style="width:100%">`;
 app.innerHTML=`<div style="max-width:420px;margin:auto"><h1>${{login:'Log in',signup:'Sign up',forgot:'Reset password'}[m]}</h1><div class="note">Accounts are stored in this browser only, so progress is available on this device and not synced. The first account created becomes the admin.</div><div class="card" style="margin-top:12px">${m==='signup'?f('an','Name'):''}${f('ae','Email','email')}${m==='forgot'?f('ar','Recovery phrase'):''}${f('ap',m==='forgot'?'New password':'Password','password')}${m==='signup'?f('ar','Recovery phrase (used to reset your password)'):''}<p><button class="btn p" onclick="doAuth('${m}')">${{login:'Log in',signup:'Create account',forgot:'Reset password'}[m]}</button></p><p class="mut">${m==='login'?`<a href="#" onclick="go('Signup');return false">Create an account</a> · <a href="#" onclick="go('Forgot');return false">Forgot password?</a>`:`<a href="#" onclick="go('Login');return false">Back to log in</a>`}</p></div></div>`}
async function doAuth(m){const g=id=>($('#'+id)?$('#'+id).value.trim():''),e=g('ae').toLowerCase(),pw=$('#ap').value,us=LS.g('ax_users',{});
 if(!e||!pw)return alert('Enter your email and password.');if(m!=='login'&&pw.length<6)return alert('Use at least 6 characters.');
 try{if(m==='signup'){if(us[e])return alert('That email already has an account.');if(!g('an')||!g('ar'))return alert('Enter your name and a recovery phrase.');const salt=Math.random().toString(36).slice(2);us[e]={name:g('an'),salt,h:await hash(salt+pw),r:await hash(salt+g('ar').toLowerCase()),admin:!Object.keys(us).length};LS.s('ax_users',us)}
 else if(m==='forgot'){const u=us[e];if(!u||u.r!==await hash(u.salt+g('ar').toLowerCase()))return alert('Email or recovery phrase is incorrect.');u.h=await hash(u.salt+pw);LS.s('ax_users',us);alert('Password updated. Please log in.');return go('Login')}
 else{const u=us[e];if(!u||u.h!==await hash(u.salt+pw))return alert('Incorrect email or password.')}}catch(x){return alert('Sign-in needs a secure (https) page.')}
 const u=us[e];U={email:e,name:u.name,admin:u.admin};LS.s('ax_sess',U);go('Dashboard')}

const csv=t=>{const rows=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h==='"'&&t[i+1]==='"'){c+='"';i++}else if(h==='"')q=0;else c+=h}else if(h==='"')q=1;else if(h===','){r.push(c);c=''}else if(h==='\n'){r.push(c);rows.push(r);r=[];c=''}else if(h!=='\r')c+=h}if(c||r.length){r.push(c);rows.push(r)}const hd=rows.shift()||[];return rows.filter(x=>x.length>1).map(x=>Object.fromEntries(hd.map((k,i)=>[k.trim(),x[i]])))};

 if(A.tab==='add'){const q=A.q||{},c=catalog();h=`<div class="card"><label>Category</label><select id="fc">${Object.keys(c).map(k=>`<option ${q.category===k?'selected':''}>${esc(k)}</option>`).join('')}</select><label>Topic</label><input id="ft" value="${esc(q.topic||'')}" list="tl"><datalist id="tl">${[...new Set(Object.values(c).flat())].map(t=>`<option>${esc(t)}</option>`).join('')}</datalist><label>Difficulty</label><select id="fd">${['Easy','Medium','Hard'].map(d=>`<option ${q.difficulty===d?'selected':''}>${d}</option>`).join('')}</select><label>Question</label><textarea id="fq">${esc(q.question||'')}</textarea><label>Options (one per line)</label><textarea id="fo">${esc((q.options||[]).join('\n'))}</textarea><label>Correct answer (must match an option)</label><input id="fa" value="${esc(q.answer||'')}" style="width:100%"><label>Explanation</label><textarea id="fe">${esc(q.explanation||'')}</textarea><label>Company</label><input id="fy" value="${esc(q.company||'General')}"><label>Tags (comma separated)</label><input id="fg" value="${esc((q.tags||[]).join(', '))}" style="width:100%"><p><button class="btn p" onclick="saveQ()">${q.id?'Save changes to #'+q.id:'Add question'}</button></p></div>`}
 if(A.tab==='import/export'){h=`<div class="card"><b>Import JSON or CSV</b><p class="mut">JSON: an array of questions in the dataset format. CSV: a header row with the same field names; separate options and tags with |.</p><input type="file" accept=".json,.csv" onchange="impFile(this)"><label>Or paste here</label><textarea id="ip"></textarea><button class="btn p" onclick="imp($('#ip').value)">Import</button></div><div class="card" style="margin-top:12px"><b>Export JSON</b><p class="mut">Copies every question, including your changes.</p><button class="btn" onclick="exp()">Copy all as JSON</button><textarea id="ex" readonly style="display:none"></textarea></div>`}

 app.innerHTML=`<h1>Admin</h1><div style="margin:8px 0">${tabs.map(t=>`<button class="btn ${A.tab===t?'p':''}" onclick="A.tab='${t}';A.q=null;admin()">${t}</button>`).join(' ')}</div><div class="note">Admin tools run in this browser. Changes are stored on this device on top of the imported dataset.</div><div style="margin-top:12px">${h}</div>`}
function editQ(id){A.q=DB.all().find(q=>q.id===id);A.tab='add';admin()}
function saveQ(){const o={...(A.q||{}),id:A.q?A.q.id:DB.nextId(),category:$('#fc').value,topic:$('#ft').value.trim(),difficulty:$('#fd').value,question:$('#fq').value.trim(),options:$('#fo').value.split('\n').map(x=>x.trim()).filter(Boolean),answer:$('#fa').value.trim(),explanation:$('#fe').value.trim(),company:$('#fy').value.trim()||'General',tags:$('#fg').value.split(',').map(x=>x.trim()).filter(Boolean)},q=DB.clean(o);
 if(!q)return alert('Check the form: category, topic, question, at least two options, and an answer that matches one option.');DB.save({...o,...q});A.q=null;A.tab='questions';admin();alert('Saved question #'+q.id)}
function imp(t){let rows;try{t=t.trim();rows=t[0]==='['?JSON.parse(t):csv(t).map(r=>({...r,options:(r.options||'').split('|'),tags:(r.tags||'').split('|').filter(Boolean)}))}catch(e){return alert('Could not read that file: '+e.message)}
 let ok=0,bad=0,id=DB.nextId();rows.forEach(r=>{if(r.id==null||r.id==='')r.id=id++;r.id=+r.id;const q=DB.clean(r);if(q){DB.save({...r,...q});ok++}else bad++});alert(`Imported ${ok} questions. Skipped ${bad} invalid rows.`);admin()}
function impFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f)}
function exp(){const t=JSON.stringify(DB.all(),null,1),e=$('#ex');e.style.display='block';e.value=t;e.style.minHeight='200px';e.select();try{navigator.clipboard.writeText(t).then(()=>alert('Copied '+DB.all().length+' questions.'),()=>{})}catch(x){}}
function addCat(){const n=$('#nc').value.trim();if(!n)return;const x=DB.ext();x.cats[n]=x.cats[n]||[];LS.s('ax_q',x);admin()}
function addTopic(){const n=$('#nt').value.trim(),c=$('#ntc').value;if(!n)return;const x=DB.ext();x.cats[c]=[...(x.cats[c]||[]),n];LS.s('ax_q',x);admin()}

const FX=(()=>{const c=$('#fx');let x=null;try{x=c.getContext('2d')}catch(e){}if(!x)return{burst(){}};

 let W,H,ps=[],f=0;const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
 const mk=(X,Y,vx,vy,l,h,r)=>{if(ps.length<420)ps.push({x:X,y:Y,vx,vy,l,m:l,h,r})};
 if(!RM)for(let i=0;i<36;i++)mk(Math.random()*W,Math.random()*H,(Math.random()-.5)*.3,-.15-Math.random()*.3,1e9,Math.random()*50,1+Math.random()*1.5);

 addEventListener('pointerdown',e=>{if(!RM)burst(e.clientX,e.clientY,12)});
 function burst(X,Y,n,h){for(let i=0;i<(n||30);i++){const a=Math.random()*6.283,s=1+Math.random()*5;mk(X,Y,Math.cos(a)*s,Math.sin(a)*s,50+Math.random()*35,h==null?Math.random()*50:h+Math.random()*30,2+Math.random()*2)}}
 (function loop(){f++;x.clearRect(0,0,W,H);const L=light();x.globalCompositeOperation=L?'source-over':'lighter';
  ps=ps.filter(p=>{const amb=p.l>1e8;p.x+=p.vx;p.y+=p.vy;if(amb){if(p.y<-10){p.y=H+10;p.x=Math.random()*W}}else{p.l--;p.vy+=.04;p.vx*=.99}
   const a=amb?.25+.2*Math.sin(f/25+p.x):p.l/p.m;if(a<=0)return false;x.fillStyle=`hsla(${p.h},100%,${L?42:65}%,${a*(L?.7:1)})`;x.beginPath();x.arc(p.x,p.y,p.r*3,0,6.283);x.globalAlpha=.18;x.fill();x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.globalAlpha=1;x.fill();return true});requestAnimationFrame(loop)})();
